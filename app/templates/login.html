{% extends "base.html" %}
{% block title %}Prijava &middot; Prehrana Plus{% endblock %}
{% block content %}
<div class="login card">
  <h1>Prehrana Plus</h1>
  <p class="sub">Prijava s šolskim računom.</p>

  {% if error %}<p class="error">{{ error }}</p>{% endif %}

  <form method="post" action="/login">
    <label for="username">Uporabniško ime</label>
    <input id="username" name="username" type="text" autocomplete="username" required autofocus>

    <label for="password">Geslo</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>

    <label class="check">
      <input type="checkbox" name="remember" value="on" checked>
      Shrani geslo, da naročanje teče samo
    </label>

    <button class="btn" type="submit">Vpiši se</button>
  </form>

  <p class="muted" style="font-size:.8rem;margin-top:1.2rem">
    Geslo preveri šola. Shranjeno je šifrirano.
  </p>
</div>
{% endblock %}
