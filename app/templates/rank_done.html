{% extends "base.html" %}
{% block title %}Končano &middot; Prehrana Plus{% endblock %}
{% block content %}
<h1>Vse ocenjeno</h1>
<p class="sub">
  {{ total }} jedi urejenih{% if progress.excluded %}, {{ progress.excluded }} zavrnjenih{% endif %}.
</p>
<div class="card">
  <div class="actions">
    <a class="btn" href="/meals">Uredi lestvico</a>
    <a class="btn ghost" href="/">Kaj se naroči</a>
  </div>
</div>

<details class="fold">
  <summary>Več</summary>
  <div class="actions">
    <a class="btn ghost" href="/tutorial">Kako to deluje</a>
    <form method="post" action="/rank/restart" class="inline"
          onsubmit="return confirm('To zbriše vse ocene in začne znova. Zavrnjene jedi ostanejo zavrnjene. Nadaljujem?')">
      <button class="btn ghost" type="submit">Oceni vse znova</button>
    </form>
  </div>
</details>
{% endblock %}
